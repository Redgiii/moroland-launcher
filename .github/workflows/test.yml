name: Tests

on:
  push:
    branches: [main]
    paths: ['tools/**', 'pack/**', 'app/assets/js/forgeinstaller.js', '.github/workflows/test.yml']
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run test:tools

  forge-install:
    # Runs the real Forge installer (about 2 minutes) on the 3 platforms players use.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: node tools/ci/forge-smoke.cjs
